name: Release

# Triggers whenever you push a version tag, e.g.:
#   git tag v0.3.0
#   git push origin v0.3.0
on:
  push:
    tags:
      - "v*"
  # Manual releases use the same version pipeline as pushed tags.
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 0.4.0 or v0.4.0)"
        required: true
        type: string

permissions:
  contents: write # needed so the workflow can create the GitHub Release and upload assets

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"   # Apple Silicon
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest"   # Intel
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"   # Linux (.AppImage / .deb)
            args: ""
          - platform: "windows-latest" # Windows (.msi / .exe)
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare version from tag
        id: release_version
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: node scripts/prepare-release.mjs

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.release_version.outputs.tag }}
          releaseName: "DbCompanion v__VERSION__"
          releaseBody: |
            ## DbCompanion ${{ steps.release_version.outputs.tag }}

            A desktop database client with a built-in AI assistant. Explore your schema, write queries, and review AI-proposed changes before executing them.

            ### Feature overview

            | Area | What you can do |
            | --- | --- |
            | Database connections | Work with PostgreSQL, MySQL, SQL Server, MongoDB, and SQLite. |
            | AI assistant | Ask questions about your live schema or describe a database change in plain English. |
            | Change review | Inspect proposed plans and risk scores before executing them. Transactions and rollback are used where supported by the database engine. |
            | Query editor | Run SQL for relational databases or use JSON and script modes for MongoDB. |
            | Schema browser | Browse tables, collections, columns, indexes, and constraints. |
            | Credential vault | Store connection details and AI provider keys encrypted at rest. |

            ### Downloads

            Choose the asset for your operating system and processor from **Assets** below. Files appear as each platform build finishes.

            | Platform | Architecture | Download | Installation |
            | --- | --- | --- | --- |
            | Windows | x64 | `.msi` or `.exe` | Run the installer. |
            | macOS (Apple Silicon) | ARM64 / `aarch64` | `.dmg` | Open the disk image and drag DbCompanion to Applications. |
            | macOS (Intel) | x64 / `x86_64` | `.dmg` | Open the disk image and drag DbCompanion to Applications. |
            | Linux | x64 / `amd64` | `.AppImage` or `.deb` | Make the AppImage executable and run it, or install the Debian package. |

            ### First launch

            1. Install and open DbCompanion.
            2. Add your database connection.
            3. Add a Gemini or OpenAI API key in **Settings** to use the AI assistant.

            **MongoDB:** Install [`mongosh`](https://www.mongodb.com/try/download/shell) and make sure it is available on your `PATH` before connecting.

            See the [README](https://github.com/${{ github.repository }}/blob/${{ steps.release_version.outputs.tag }}/README.md) for more details, or [report an issue](https://github.com/${{ github.repository }}/issues).
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
